name: Checks

on:
  # Run on all PRs
  pull_request:
  # It should also be possible to run all checks manually
  workflow_dispatch:

permissions: {}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Comment on the PR when its title fails the check
      pull-requests: write

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: pr_title_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add a comment if PR title check fails
        if: always() && (steps.pr_title_check.outputs.error_message != null)
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-check-error
          message: |
            We would like the titles of new Pull Requests to follow the [Conventional Commits specification](https://www.conventionalcommits.org/), and it looks like your PR title needs to be adjusted.

            Details:
            ```
            ${{ steps.pr_title_check.outputs.error_message }}
            ```

      - name: Remove the comment if the issue has been resolved
        if: ${{ steps.pr_title_check.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-check-error
          delete: true

  super-linter:
    name: Super-Linter
    if: github.actor != 'renovate[bot]' # skip for Renovate PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Post the summary comment on the PR
      pull-requests: write
      # Report a commit status per linter
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper
          # list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Check files with Super-Linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          # Validate the preset with renovate-config-validator, which otherwise
          # only checks the standard repo config file names (renovate.json etc.)
          RENOVATE_SHAREABLE_CONFIG_PRESET_FILE_NAMES: default.json
